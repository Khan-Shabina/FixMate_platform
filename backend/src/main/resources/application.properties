# Spring Boot Application Settings
spring.application.name=fixmate-backend
server.port=8080

# ===================================================================
# Active Database Configuration: H2 In-Memory (Zero Setup Required)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:fixmate_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings for H2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===================================================================
# Alternative: MySQL Database Configuration (Uncomment to use MySQL)
# Ensure MySQL server is running and fixmate_db exists or schema is imported
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/fixmate_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
# spring.datasource.username=root
