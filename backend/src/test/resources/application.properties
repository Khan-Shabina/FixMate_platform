# Spring Boot Application Test Settings
spring.application.name=fixmate-backend-test

# H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:fixmate_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# SQL Initialization for Test
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# JWT Test Secret Key (64 characters)
app.jwt.secret=9a2f8c4e1b7d6a5c3e8f0b1a9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d
app.jwt.expiration-ms=86400000

# CORS Settings
cors.allowed-origins=http://localhost:5173,http://localhost:3000
